<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Careers at Superintuition." />
    <title>Careers · Superintuition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Homemade+Apple&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #111213;
        --text: #d6d6d6;
        --muted: #8b8e8c;
        --signal: #39ff14;
        --signature: "Homemade Apple", cursive;
        --mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas,
          "Liberation Mono", monospace;
      }
      * { box-sizing: border-box; }
      html { background: var(--background); }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--background);
        font-family: var(--mono);
        font-size: 0.9rem;
        line-height: 1.4;
        -webkit-font-smoothing: antialiased;
      }
      ::selection { color: var(--background); background: var(--signal); }
      a { color: var(--signal); text-decoration: none; }
      a:hover, a:focus { text-decoration: underline; }
      .page {
        width: min(calc(100% - 48px), 650px);
        margin: 0 auto;
        padding: 50px 0 32px;
      }
      h1 {
        margin: 0 0 16px;
        font-family: var(--signature);
        font-size: 33px;
        font-weight: 400;
        line-height: 1.05;
      }
      h1 a { color: inherit; }
      h1 a:hover, h1 a:focus { text-decoration: none; }
      p { margin: 0 0 1em; }
      footer { margin-top: 2em; color: var(--muted); font-size: 11px; }
      @media (max-width: 600px) {
        .page { width: min(calc(100% - 28px), 650px); padding-top: 38px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1><a href="/">superintuition.</a></h1>
      <p>We are not hiring at the moment.</p>
      <footer>Superintuition © 2026</footer>
    </main>
  </body>
</html>
